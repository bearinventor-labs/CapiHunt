[package]
name = "CapiHunt"
version = "0.1.0"
authors = [""]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
agb = { git = "https://github.com/agbrs/agb.git", rev = "32b54dc51b6435fc25414ae034dc890afab7ac9c" }
agb_tracker = { git = "https://github.com/agbrs/agb.git", rev = "32b54dc51b6435fc25414ae034dc890afab7ac9c", default-features = false, features = ["agb", "xm"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
